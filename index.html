<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Prototype — deviner la ville par le relief</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  :root {
    --bg: #f4f1ea;
    --ink: #262420;
    --muted: #6b6558;
    --line: #ddd6c8;
    --accent: #b0503a;
    --ok: #4a7c59;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px 14px 40px;
  }
  h1 { font-size: 16px; margin: 0 0 2px; text-align: center; }
  .sub { font-size: 12px; color: var(--muted); margin-bottom: 14px; text-align: center; max-width: 460px; }

  .top-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 12px; }
  .mode-toggle { display: flex; gap: 4px; border: 1px solid var(--line); border-radius: 20px; padding: 2px; background: #fff; }
  .mode-toggle button {
    border: none; background: transparent; padding: 5px 12px; font-size: 11px; border-radius: 16px; cursor: pointer; color: var(--muted);
  }
  .mode-toggle button.active { background: var(--ink); color: #fff; }

  .hint-btn {
    padding: 5px 12px; font-size: 11px; border-radius: 20px; border: 1px solid var(--line); background: #fff; cursor: pointer;
  }
  .hint-btn:disabled { opacity: 0.45; cursor: default; }
  .hint-display { font-size: 12px; color: var(--muted); margin-bottom: 8px; text-align: center; min-height: 16px; }
  .hint-display .flag { font-size: 20px; margin-right: 6px; }

  .levels { display: flex; gap: 6px; margin-bottom: 14px; flex-wrap: wrap; justify-content: center; }
  .levels .step {
    padding: 5px 11px; font-size: 11px; border-radius: 20px; border: 1px solid var(--line); background: #fff; color: var(--muted);
  }
  .levels .step.current { background: var(--ink); color: #fff; border-color: var(--ink); }
  .levels .step.spent { background: #eae4d6; color: #b6ae9c; text-decoration: line-through; }

  .stage { position: relative; width: min(460px, 88vw); height: min(460px, 88vw); }
  .circle-mask {
    width: 100%; height: 100%; border-radius: 50%; overflow: hidden;
    box-shadow: 0 0 0 6px #fff, 0 0 0 7px var(--line), 0 10px 24px rgba(0,0,0,0.12);
    filter: saturate(1.7) contrast(1.3) brightness(1.04);
  }
  #map { width: 100%; height: 100%; background: #dfe7ea; }
  .leaflet-control-attribution { font-size: 9px !important; }

  .diameter-label { position: absolute; bottom: -24px; left: 50%; transform: translateX(-50%); font-size: 11px; color: var(--muted); white-space: nowrap; }

  .score { margin-top: 32px; font-size: 12px; color: var(--muted); text-align: center; }

  .choices {
    margin-top: 18px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(460px, 92vw);
  }
  @media (max-width: 420px) { .choices { grid-template-columns: 1fr; } }
  .choices button {
    padding: 12px 10px; font-size: 14px; border-radius: 6px; border: 1px solid var(--line); background: #fff; cursor: pointer; text-align: left;
  }
  .choices button:hover:not(:disabled) { border-color: var(--ink); }
  .choices button.correct { background: var(--ok); color: #fff; border-color: var(--ok); }
  .choices button.wrong { background: var(--accent); color: #fff; border-color: var(--accent); opacity: 0.85; }
  .choices button:disabled { cursor: default; }

  .text-form { margin-top: 18px; display: flex; gap: 8px; width: min(460px, 92vw); }
  .text-form input {
    flex: 1; padding: 10px 12px; font-size: 14px; border-radius: 6px; border: 1px solid var(--line);
  }
  .text-form button {
    padding: 10px 16px; font-size: 13px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer;
  }
  .text-form button:disabled { opacity: 0.5; cursor: default; }

  .feedback { min-height: 34px; margin-top: 12px; font-size: 13px; text-align: center; max-width: min(460px, 92vw); }
  .feedback.error { color: var(--accent); font-family: monospace; font-size: 11px; text-align: left; white-space: pre-wrap; }
  .next-btn {
    margin-top: 8px; padding: 8px 16px; font-size: 13px; border-radius: 6px; border: 1px solid var(--ink); background: var(--ink); color: #fff; cursor: pointer; display: none;
  }
</style>
</head>
<body>

<h1>Deviner la ville par le relief</h1>
<div class="sub">Relief réel (Esri, sans aucun label). Chaque mauvaise réponse dézoome — mais rapporte moins de points.</div>

<div class="top-row">
  <div class="mode-toggle" id="modeToggle"></div>
  <button class="hint-btn" id="hintBtn">🏳 Indice (drapeau) — score ÷2</button>
</div>
<div class="hint-display" id="hintDisplay"></div>

<div class="levels" id="levels"></div>

<div class="stage">
  <div class="circle-mask"><div id="map"></div></div>
  <div class="diameter-label" id="diameterLabel"></div>
</div>

<div class="choices" id="choices" style="display:none;"></div>

<form class="text-form" id="textForm" style="display:none;">
  <input id="guessInput" list="cityList" placeholder="Nom de la ville (en anglais)" autocomplete="off" />
  <datalist id="cityList"></datalist>
  <button type="submit">Valider</button>
</form>

<div class="feedback" id="feedback"></div>
<button class="next-btn" id="nextBtn">Ville suivante →</button>
<div class="score" id="score">Score total : 0 pt — 0 manche jouée</div>

<script>
// Noms de villes en ANGLAIS (utilisés pour l'autocomplétion / la saisie).
// "country" reste en français pour l'affichage QCM ; "cc" = code pays ISO
// (pour l'indice drapeau). Toutes les séries sont mélangées pour l'instant
// (montagne/côte/île pas encore séparées — prochaine étape).
const CITIES = [
  { city: "Grenoble", country: "France", cc: "FR", lat: 45.1885, lon: 5.7245 },
  { city: "La Paz", country: "Bolivie", cc: "BO", lat: -16.5000, lon: -68.1500 },
  { city: "Denver", country: "États-Unis", cc: "US", lat: 39.7392, lon: -104.9903 },
  { city: "Innsbruck", country: "Autriche", cc: "AT", lat: 47.2692, lon: 11.4041 },
  { city: "Amsterdam", country: "Pays-Bas", cc: "NL", lat: 52.3676, lon: 4.9041 },
  { city: "San Francisco", country: "États-Unis", cc: "US", lat: 37.7749, lon: -122.4194 },
  { city: "Hong Kong", country: "Chine", cc: "HK", lat: 22.3193, lon: 114.1694 },
  { city: "Kathmandu", country: "Népal", cc: "NP", lat: 27.7172, lon: 85.3240 },
  { city: "Phoenix", country: "États-Unis", cc: "US", lat: 33.4484, lon: -112.0740 },
  { city: "Cape Town", country: "Afrique du Sud", cc: "ZA", lat: -33.9249, lon: 18.4241 },
  { city: "Rio de Janeiro", country: "Brésil", cc: "BR", lat: -22.9068, lon: -43.1729 },
  { city: "Chicago", country: "États-Unis", cc: "US", lat: 41.8781, lon: -87.6298 },
  { city: "Reykjavik", country: "Islande", cc: "IS", lat: 64.1466, lon: -21.9426 },
  { city: "Bern", country: "Suisse", cc: "CH", lat: 46.9480, lon: 7.4474 },
  { city: "Venice", country: "Italie", cc: "IT", lat: 45.4408, lon: 12.3155 },
];

const LEVELS = [
  { diameterKm: 50, points: 100 },
  { diameterKm: 100, points: 60 },
  { diameterKm: 200, points: 35 },
  { diameterKm: 500, points: 15 },
];

function flagEmoji(cc) {
  return cc.toUpperCase().replace(/./g, (c) => String.fromCodePoint(127397 + c.charCodeAt(0)));
}
function normalize(s) {
  return s.trim().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
}

const isMobile = window.matchMedia("(max-width: 640px)").matches;
let inputMode = "choices"; // "choices" | "text"

let levelIndex = 0;
let current = null;
let hintUsed = false;
let totalScore = 0, rounds = 0;
let map;

// --- UI mode (desktop only : choix ou saisie) ---
const modeToggleEl = document.getElementById("modeToggle");
if (!isMobile) {
  const btnChoices = document.createElement("button");
  btnChoices.textContent = "8 choix";
  btnChoices.classList.add("active");
  const btnText = document.createElement("button");
  btnText.textContent = "Saisie";
  btnChoices.onclick = () => { inputMode = "choices"; btnChoices.classList.add("active"); btnText.classList.remove("active"); renderAnswerUI(); };
  btnText.onclick = () => { inputMode = "text"; btnText.classList.add("active"); btnChoices.classList.remove("active"); renderAnswerUI(); };
  modeToggleEl.appendChild(btnChoices);
  modeToggleEl.appendChild(btnText);
} else {
  modeToggleEl.style.display = "none";
}

// Datalist rempli une seule fois avec TOUTES les villes du jeu (juste pour
// corriger l'orthographe / les variantes, pas pour indiquer les bonnes réponses possibles).
const datalist = document.getElementById("cityList");
CITIES.forEach((c) => {
  const opt = document.createElement("option");
  opt.value = c.city;
  datalist.appendChild(opt);
});

function showError(err) {
  const el = document.getElementById("feedback");
  el.className = "feedback error";
  el.textContent = "Erreur prototype : " + (err && err.message ? err.message : err);
  console.error(err);
}

function initMap() {
  map = L.map("map", {
    zoomControl: false, dragging: false, scrollWheelZoom: false, doubleClickZoom: false,
    touchZoom: false, boxZoom: false, keyboard: false, zoomSnap: 0, zoomDelta: 0.25,
    attributionControl: true, fadeAnimation: false, maxZoom: 14,
  });

  L.tileLayer(
    "https://server.arcgisonline.com/ArcGIS/rest/services/World_Terrain_Base/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 14, maxNativeZoom: 8, attribution: "Relief : Esri, USGS, NOAA" }
  ).addTo(map);

  map.createPane("hillshadePane");
  const pane = map.getPane("hillshadePane");
  pane.style.mixBlendMode = "multiply";
  pane.style.zIndex = 450;

  L.tileLayer(
    "https://elevation3d.arcgis.com/arcgis/rest/services/Elevation/World_Hillshade/MapServer/tile/{z}/{y}/{x}",
    { maxZoom: 14, maxNativeZoom: 13, opacity: 0.9, pane: "hillshadePane" }
  ).addTo(map);
}

function zoomForDiameter(lat, diameterKmValue, containerPx) {
  const metersPerPixelNeeded = (diameterKmValue * 1000) / containerPx;
  const latRad = (lat * Math.PI) / 180;
  const z = Math.log2((156543.03392804097 * Math.cos(latRad)) / metersPerPixelNeeded);
  return Math.min(14, Math.max(2, z));
}

function pickCity(excludeName) {
  let c;
  do { c = CITIES[Math.floor(Math.random() * CITIES.length)]; } while (c.city === excludeName);
  return c;
}

function pickChoices(correct, count) {
  const others = CITIES.filter((c) => c.city !== correct.city);
  const shuffled = others.sort(() => Math.random() - 0.5).slice(0, count - 1);
  return [...shuffled, correct].sort(() => Math.random() - 0.5);
}

const levelsEl = document.getElementById("levels");
function renderLevelSteps() {
  levelsEl.innerHTML = "";
  LEVELS.forEach((l, i) => {
    const span = document.createElement("span");
    span.className = "step" + (i === levelIndex ? " current" : i < levelIndex ? " spent" : "");
    span.textContent = `${l.diameterKm} km (${l.points}pt)`;
    levelsEl.appendChild(span);
  });
}

function renderMapAtCurrentLevel() {
  const containerPx = document.getElementById("map").clientWidth;
  const diameter = LEVELS[levelIndex].diameterKm;
  const z = zoomForDiameter(current.lat, diameter, containerPx);
  map.setView([current.lat, current.lon], z, { animate: false });
  document.getElementById("diameterLabel").textContent =
    `Diamètre affiché : ${diameter} km — niveau ${levelIndex + 1}/${LEVELS.length}`;
  renderLevelSteps();
}

function currentPoints() {
  const base = LEVELS[levelIndex].points;
  return hintUsed ? Math.round(base / 2) : base;
}

function renderAnswerUI() {
  const choicesEl = document.getElementById("choices");
  const textForm = document.getElementById("textForm");
  const useText = !isMobile && inputMode === "text";

  choicesEl.style.display = useText ? "none" : "grid";
  textForm.style.display = useText ? "flex" : "none";

  if (useText) {
    choicesEl.innerHTML = "";
    const input = document.getElementById("guessInput");
    input.value = "";
    input.disabled = false;
    input.focus();
  } else {
    textForm.reset && textForm.reset();
    const count = isMobile ? 6 : 8;
    choicesEl.innerHTML = "";
    pickChoices(current, count).forEach((opt) => {
      const btn = document.createElement("button");
      btn.textContent = `${opt.city} (${opt.country})`;
      btn.dataset.city = opt.city;
      btn.onclick = () => resolveAnswer(opt.city === current.city, btn);
      choicesEl.appendChild(btn);
    });
  }
}

function newRound() {
  current = pickCity(current ? current.city : null);
  levelIndex = 0;
  hintUsed = false;
  document.getElementById("hintBtn").disabled = false;
  document.getElementById("hintDisplay").textContent = "";
  renderMapAtCurrentLevel();

  const fb = document.getElementById("feedback");
  fb.className = "feedback";
  fb.textContent = "";
  document.getElementById("nextBtn").style.display = "none";

  renderAnswerUI();
}

function resolveAnswer(isCorrect, btnEl) {
  if (isCorrect) {
    rounds++;
    const pts = currentPoints();
    totalScore += pts;
    if (btnEl) {
      [...document.getElementById("choices").children].forEach((b) => (b.disabled = true));
      btnEl.classList.add("correct");
    } else {
      document.getElementById("guessInput").disabled = true;
    }
    document.getElementById("feedback").textContent =
      `Bonne réponse — +${pts} points (trouvé à ${LEVELS[levelIndex].diameterKm} km${hintUsed ? ", indice utilisé" : ""}).`;
    finishRound();
    return;
  }

  if (btnEl) { btnEl.classList.add("wrong"); btnEl.disabled = true; }

  if (levelIndex < LEVELS.length - 1) {
    levelIndex++;
    renderMapAtCurrentLevel();
    document.getElementById("feedback").textContent =
      `Faux. Dézoom automatique — niveau ${levelIndex + 1}/${LEVELS.length} (${currentPoints()} points possibles).`;
    if (!btnEl) document.getElementById("guessInput").value = "";
  } else {
    rounds++;
    if (btnEl) {
      [...document.getElementById("choices").children].forEach((b) => {
        b.disabled = true;
        if (b.dataset.city === current.city) b.classList.add("correct");
      });
    } else {
      document.getElementById("guessInput").disabled = true;
    }
    document.getElementById("feedback").textContent = `Perdu — c'était ${current.city} (${current.country}).`;
    finishRound();
  }
}

function finishRound() {
  document.getElementById("score").textContent =
    `Score total : ${totalScore} pt — ${rounds} manche${rounds > 1 ? "s" : ""} jouée${rounds > 1 ? "s" : ""}`;
  document.getElementById("nextBtn").style.display = "inline-block";
}

document.getElementById("nextBtn").onclick = newRound;

document.getElementById("hintBtn").onclick = () => {
  if (hintUsed) return;
  hintUsed = true;
  document.getElementById("hintBtn").disabled = true;
  document.getElementById("hintDisplay").innerHTML =
    `<span class="flag">${flagEmoji(current.cc)}</span>${current.country}`;
};

document.getElementById("textForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const input = document.getElementById("guessInput");
  if (input.disabled) return;
  const val = normalize(input.value);
  if (!val) return;
  const isCorrect = normalize(current.city) === val;
  resolveAnswer(isCorrect, null);
});

try {
  if (typeof L === "undefined") throw new Error("Leaflet ne s'est pas chargé depuis le CDN.");
  initMap();
  newRound();
} catch (err) {
  showError(err);
}
</script>

</body>
</html>
