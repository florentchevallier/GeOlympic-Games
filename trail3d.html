<style>

  #app { display: flex; flex-direction: column; height: 100dvh; align-items: center; padding: 10px; gap: 8px; }

  .bar button, .bar select { padding: 6px 12px; font-size: 12px; border-radius: 18px; border: 1px solid var(--line); background: #fff; cursor: pointer; }
  .bar button.active { background: var(--ink); color: #fff; border-color: var(--ink); }
  .bar label { color: var(--muted); display: flex; gap: 6px; align-items: center; }
  #answer { font-weight: 600; min-height: 18px; }
  #status { font-size: 11px; color: var(--muted); min-height: 14px; text-align: center; }
  .hint { position: absolute; left: 10px; bottom: 10px; font-size: 11px; background: rgba(255,255,255,0.85); padding: 4px 8px; border-radius: 8px; pointer-events: none; }
</style>

COURSES.forEach((c, i) => { const o = document.createElement("option"); o.value = i; o.textContent = `Course ${i + 1}`; sel.appendChild(o); });

function boundsOf(coords) {
  let w = 180, e = -180, s = 90, n = -90;
  coords.forEach(([x, y]) => { w = Math.min(w, x); e = Math.max(e, x); s = Math.min(s, y); n = Math.max(n, y); });
  return [w, s, e, n];
}
function setCourse(i) {
  idx = i;
  const c = COURSES[i];
  bounds = boundsOf(c.coords);
  const src = map.getSource("course");
  const gj = { type: "Feature", geometry: { type: "LineString", coordinates: c.coords } };
  if (src) src.setData(gj); else return;
  map.getSource("start").setData({ type: "Feature", geometry: { type: "Point", coordinates: c.coords[0] } });
  document.getElementById("answer").textContent = "";
  document.getElementById("revealBtn").textContent = "Reveal name";
  map.setMaxBounds(null);
  resetView(0);
}
function resetView(duration = 600) {
  // Fit the course's bounding circle, so it stays in frame whatever the bearing.
  const lat = (bounds[1] + bounds[3]) / 2, lon = (bounds[0] + bounds[2]) / 2;
  const kmW = (bounds[2] - bounds[0]) * 111.32 * Math.cos(lat * Math.PI / 180), kmH = (bounds[3] - bounds[1]) * 110.57;
  const r = Math.hypot(kmW, kmH) / 2;
  const dLat = r / 110.57, dLon = r / (111.32 * Math.cos(lat * Math.PI / 180));
  const cam = map.cameraForBounds([[lon - dLon, lat - dLat], [lon + dLon, lat + dLat]], { padding: 24 });
  const z = Math.min(12, cam.zoom - 0.1);
  map.setMinZoom(z - 1); map.setMaxZoom(z + 2.5); // no panning, so zoom limits keep the player on the massif
  map.easeTo({ center: cam.center, zoom: z, pitch: 52, bearing: Math.floor(Math.random() * 360), duration });
}

map.on("load", () => {
  map.addSource("course", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addSource("start", { type: "geojson", data: { type: "FeatureCollection", features: [] } });
  map.addLayer({ id: "course-casing", type: "line", source: "course", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#fff", "line-width": 6.5, "line-opacity": 0.9 } });
  map.addLayer({ id: "course-line", type: "line", source: "course", layout: { "line-join": "round", "line-cap": "round" }, paint: { "line-color": "#d4202a", "line-width": 3.6 } });
  map.addLayer({ id: "start-dot", type: "circle", source: "start", paint: { "circle-radius": 6, "circle-color": "#3f7d58", "circle-stroke-color": "#fff", "circle-stroke-width": 2.2 } });
  map.setTerrain({ source: "dem", exaggeration: 1.5 });
  setCourse(0);
});
map.on("error", (e) => { statusEl().textContent = "Map error: " + (e.error && e.error.message || e); });
map.on("idle", () => { document.getElementById("status").textContent = ""; });

// One-finger / left-button drag orbits the model (rotate + tilt), pinch / wheel zooms.
const el = map.getCanvasContainer();
el.addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch" && !e.isPrimary) return;
  // Both axes inverted (mouse and touch): dragging turns the model like an object held in the hand.
  orbit = { x: e.clientX, y: e.clientY, b: map.getBearing(), p: map.getPitch(), id: e.pointerId, k: -1 };
  el.setPointerCapture(e.pointerId);
});
el.addEventListener("pointermove", (e) => {
  if (!orbit || e.pointerId !== orbit.id) return;
  const dx = e.clientX - orbit.x, dy = e.clientY - orbit.y;
  map.jumpTo({ bearing: orbit.b - orbit.k * dx * 0.45, pitch: Math.max(5, Math.min(80, orbit.p + orbit.k * dy * 0.3)) });
});
const endOrbit = () => { orbit = null; };
el.addEventListener("pointerup", endOrbit);
el.addEventListener("pointercancel", endOrbit);

sel.onchange = () => setCourse(Number(sel.value));
document.getElementById("revealBtn").onclick = () => {
  document.getElementById("answer").textContent = COURSES[idx].name;
  document.getElementById("revealBtn").textContent = "Revealed";
};
document.getElementById("resetBtn").onclick = () => resetView();
const texBtn = document.getElementById("texBtn");
let fullTex = false;
texBtn.onclick = () => {
  fullTex = !fullTex;
  map.setLayoutProperty("full", "visibility", fullTex ? "visible" : "none");
  map.setLayoutProperty("relief", "visibility", fullTex ? "none" : "visible");
  texBtn.textContent = fullTex ? "Texture: full OpenTopoMap (labels!)" : "Texture: relief only";
};
const exag = document.getElementById("exag");
exag.oninput = () => { document.getElementById("exagVal").textContent = exag.value; map.setTerrain({ source: "dem", exaggeration: Number(exag.value) }); };
</script>
</body>
</html>
